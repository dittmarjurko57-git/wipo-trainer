<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wirtschaftspolitik-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: einspaltige Lern-App (max 680px), Kopfbereich wie Karopapier mit Konjunkturkurve */
:root{
  --paper:#eef2ee; --card:#ffffff; --ink:#16212b; --muted:#56626b; --line:#d3dcd5; --grid:#dbe4dd;
  --accent:#0b6b60; --accent-ink:#ffffff; --accent-soft:#d5ebe5;
  --amber:#9a6200; --amber-soft:#f6e8c8;
  --ok:#22703a; --ok-soft:#dcefdf; --bad:#ad2a20; --bad-soft:#f8dedb;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10161b; --card:#182128; --ink:#e5ebe8; --muted:#9ca8ae; --line:#2b363e; --grid:#1b252c;
  --accent:#4cbfad; --accent-ink:#0b1a17; --accent-soft:#173833;
  --amber:#e8b44c; --amber-soft:#3a2f16;
  --ok:#72c486; --ok-soft:#183324; --bad:#f2918a; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10161b; --card:#182128; --ink:#e5ebe8; --muted:#9ca8ae; --line:#2b363e; --grid:#1b252c;
  --accent:#4cbfad; --accent-ink:#0b1a17; --accent-soft:#173833;
  --amber:#e8b44c; --amber-soft:#3a2f16;
  --ok:#72c486; --ok-soft:#183324; --bad:#f2918a; --bad-soft:#3d1f1d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:17px/1.55 var(--f-body);padding-inline:16px;-webkit-text-size-adjust:100%}
#main{max-width:680px;margin:0 auto;padding-block:12px 80px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.2rem;font-weight:700;margin-top:1.6em;margin-bottom:.5em}
h4{font-size:1.02rem;font-weight:700}
p{margin:.5em 0}
b{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{font-size:.86rem;color:var(--muted)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 .4em}

/* Startseite */
.hero{border:1px solid var(--line);border-radius:18px;padding:20px 18px 14px;
  background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.hero p.intro{max-width:46ch;margin:.6em 0 0}
.wave{width:100%;height:auto;display:block;margin-top:6px}
.wave .trend{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.5;fill:none}
.wave .curve{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.wave text{fill:var(--muted);font:600 11px var(--f-body)}
.wave .dot{fill:var(--card);stroke:var(--accent);stroke-width:2.5}
.wave .dot.done{fill:var(--accent)}
.wave .dot.next{stroke:var(--amber);stroke-width:3.5}
.wave .dn{font:800 12px var(--f-display);fill:var(--accent)}
.wave .dn.done{fill:var(--accent-ink)}
.prog{font-weight:700;margin:2px 0 0;font-variant-numeric:tabular-nums}
.day{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 0 10px}
.day span{color:var(--muted);font-size:.9rem}
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.unit:hover{border-color:var(--accent)}
.unit .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 1.1rem var(--f-display);
  border:2px solid var(--accent);color:var(--accent)}
.unit.done .num{background:var(--accent);color:var(--accent-ink)}
.unit .ttl{font:700 1.08rem var(--f-display)}
.unit .sub{color:var(--muted);font-size:.92rem;line-height:1.35}
.unit .meta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.prio{background:var(--amber-soft);color:var(--amber)}
.linkcard{display:block;width:100%;text-align:left;margin-top:26px;background:var(--accent-soft);border:0;border-radius:14px;padding:16px}
.linkcard h4{color:var(--accent)}
.reset{margin-top:28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Kopfzeile in Einheiten */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px 8px;margin-bottom:4px}
.toprow{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700}
.toprow h2{font-size:1.15rem;flex:1;min-width:0}
.steps{display:flex;gap:6px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stp{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.88rem;font-weight:700;color:var(--muted)}
.stp.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stp.ok::before{content:"✓ ";color:var(--ok)}
.stp.on.ok::before{color:var(--paper)}

/* Lerntext */
.lesson .lead{font-size:1.1rem}
.lesson ul,.lesson ol{padding-left:1.2em;margin:.4em 0}
.lesson li{margin:.25em 0}
.tw{overflow-x:auto;margin:.7em 0}
table.t{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--card)}
table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--accent-soft);font-family:var(--f-display)}
.duo{display:grid;gap:12px;margin:.8em 0}
@media (min-width:620px){.duo{grid-template-columns:1fr 1fr}}
.dcol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.kicker{color:var(--accent);font-weight:700;font-size:.9rem;margin:.1em 0 .5em}
.ex{font-size:.9rem;color:var(--muted)}
.note,.tip,.teach{border-radius:12px;padding:12px 14px;margin:1em 0}
.note{background:var(--amber-soft)}
.tip{background:var(--accent-soft)}
.teach{border:2px dashed var(--accent);background:var(--card)}
.teach .lbl{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:4px}
.chain{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:.7em 0}
.formula{font:700 1.35rem var(--f-display);text-align:center;margin:.6em 0;letter-spacing:.02em}
.phases,.goals{display:grid;gap:10px;margin:.8em 0}
@media (min-width:560px){.phases,.goals{grid-template-columns:1fr 1fr}}
.ph,.g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.ph h4 span{font-weight:500;color:var(--muted)}
.ph p,.g p{font-size:.93rem;margin:.3em 0}
.g.new{border-style:dashed}
.rel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:.6em 0}
.rel h4::before{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-right:6px;vertical-align:2px}
.rel.bad h4::before{content:"Konflikt";background:var(--bad-soft);color:var(--bad)}
.rel.good h4::before{content:"Harmonie";background:var(--ok-soft);color:var(--ok)}
.rel.neu h4::before{content:"Neutral";background:var(--line);color:var(--ink)}
.rel p{margin:.3em 0 0;font-size:.95rem}
ol.big{padding-left:1.4em}
ol.big li{margin:.55em 0}
.cyc{width:100%;height:auto;max-width:520px;display:block;margin:.4em auto}
.cyc .trend{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.5;fill:none}
.cyc .curve{stroke:var(--accent);stroke-width:3;fill:none}
.cyc text{fill:var(--ink);font:700 11px var(--f-body)}
.cyc .lab2{fill:var(--muted);font-weight:400}

/* Knöpfe */
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.warn{background:var(--bad);color:var(--card)}
.btn.wide{width:100%;margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* Karteikarten */
.flash{width:100%;min-height:240px;border:1px solid var(--line);border-radius:18px;background:var(--card);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 20px;gap:10px}
.flash .term{font:800 1.6rem var(--f-display)}
.flash .def{font-size:1.08rem;max-width:42ch}
.flash .hint{font-size:.85rem;color:var(--muted)}
.flash.back{background:var(--accent-soft);border-color:var(--accent)}
.counter{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px;font-variant-numeric:tabular-nums}

/* Quiz */
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);margin:6px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.q{font-size:1.18rem;margin:.4em 0 .7em}
.opts{display:grid;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.dim{opacity:.6}
.expl{border-radius:12px;padding:12px 14px;margin-top:12px}
.expl.ok{background:var(--ok-soft)}
.expl.bad{background:var(--bad-soft)}
.expl.ok b{color:var(--ok)} .expl.bad b{color:var(--bad)}
details.ctx{background:var(--amber-soft);border-radius:12px;padding:10px 14px;margin-bottom:10px}
details.ctx summary{font-weight:700;cursor:pointer}
details.ctx table.t{font-size:.88rem;margin-top:8px}
.result{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 18px}
.result .big{font:800 3rem var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.sol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}

/* Sortieren */
.sortcard{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:26px 18px;text-align:center;font:700 1.15rem var(--f-display);min-height:130px;display:grid;place-items:center}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sortbtns button{border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:12px;padding:14px 8px;font-weight:700}
.sortbtns button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sortbtns button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

textarea{width:100%;min-height:220px;font:inherit;font-size:1rem;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.flash,.opt,.unit{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>

<main id="main"><div style="padding:24px 4px;max-width:520px;margin:0 auto">
<h1 style="font-size:1.6rem">Wirtschaftspolitik-Trainer</h1>
<p>Die App wird geladen … Falls hier nichts passiert, öffne diese Seite bitte direkt in Safari oder Chrome (nicht in einer App-Vorschau).</p>
</div></main>

<script>
/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEY = 'wipo-trainer-v1';
let P = { done: {}, score: {}, wrong: {}, notes: {} };
try { const s = localStorage.getItem(KEY); if (s) P = Object.assign(P, JSON.parse(s)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

/* Konjunkturkurve */
function wy(x) { return 108 - (x - 10) * 50 / 320 + 26 * Math.cos(2 * Math.PI * (x - 30) / 200); }
function curvePath() { let d = ''; for (let x = 10; x <= 330; x += 4) d += (d ? ' L' : 'M') + x + ' ' + wy(x).toFixed(1); return d; }
function cycleSVG() {
  return '<svg class="cyc" viewBox="0 0 340 170" role="img" aria-label="Konjunkturzyklus: Wellenbewegung des BIP um den langfristigen Wachstumstrend">' +
    '<line x1="6" y1="160" x2="334" y2="160" stroke="currentColor" opacity=".35"/><line x1="6" y1="6" x2="6" y2="160" stroke="currentColor" opacity=".35"/>' +
    '<text x="10" y="14" class="lab2">BIP</text><text x="334" y="154" text-anchor="end" class="lab2">Zeit</text>' +
    '<path class="trend" d="M10 108 L330 58"/><text x="300" y="52" text-anchor="end" class="lab2">langfristiger Trend</text>' +
    '<path class="curve" d="' + curvePath() + '"/>' +
    '<text x="38" y="148">Depression</text>' +
    '<text x="72" y="' + (wy(80)).toFixed(0) + '" text-anchor="end">Aufschwung</text>' +
    '<text x="130" y="' + (wy(130) - 10).toFixed(0) + '" text-anchor="middle">Boom</text>' +
    '<text x="190" y="' + (wy(180) - 4).toFixed(0) + '">Rezession</text>' +
    '</svg>';
}
function homeWave(doneArr, next) {
  const xs = [32, 88, 144, 200, 256, 312];
  let s = '<svg class="wave" viewBox="0 0 340 150" role="img" aria-label="Fortschritt: 6 Lernblöcke entlang einer Konjunkturkurve">' +
    '<path class="trend" d="M10 108 L330 58"/><path class="curve" d="' + curvePath() + '"/>';
  xs.forEach((x, i) => {
    const y = wy(x); const c = doneArr[i] ? 'done' : (i === next ? 'next' : '');
    s += '<circle class="dot ' + c + '" cx="' + x + '" cy="' + y.toFixed(1) + '" r="12"/>' +
      '<text class="dn ' + (doneArr[i] ? 'done' : '') + '" x="' + x + '" y="' + (y + 4.3).toFixed(1) + '" text-anchor="middle">' + (i + 1) + '</text>';
  });
  return s + '</svg>';
}

/* ---------- Inhalte ---------- */
const L1 = `
<p class="lead">Die Wirtschaft wächst nicht gleichmäßig. Sie schwankt in Wellen um ihren langfristigen Wachstumstrend. Diese Schwankungen heißen <b>Konjunktur</b>. Gemessen wird sie vor allem am <b>realen BIP</b>.</p>
${cycleSVG()}
<h3>Die vier Phasen</h3>
<div class="phases">
<div class="ph"><h4>Aufschwung <span>(Expansion)</span></h4><p>Nachfrage und Produktion steigen, Unternehmen investieren wieder, Optimismus wächst. Die Arbeitslosigkeit beginnt zu sinken.</p></div>
<div class="ph"><h4>Boom <span>(Hochkonjunktur)</span></h4><p>Kapazitätsgrenze erreicht, kaum Arbeitslosigkeit, Fachkräfte fehlen. Löhne und Preise steigen stark: <b>Inflationsgefahr</b>.</p></div>
<div class="ph"><h4>Rezession</h4><p>Nachfrage und Produktion gehen zurück, Investitionen werden verschoben. Die Arbeitslosigkeit steigt.</p></div>
<div class="ph"><h4>Depression <span>(Krise, Tiefpunkt)</span></h4><p>Hohe Arbeitslosigkeit, schwache Nachfrage, pessimistische Erwartungen, niedrige Zinsen. Danach beginnt der nächste Aufschwung.</p></div>
</div>
<div class="teach"><span class="lbl">Definitionen aus deinem Unterricht</span>
<p><b>Abschwung:</b> Stagnation von einem Quartal zum anderen.<br>
<b>Rezession:</b> Stagnation oder Schrumpfen über mindestens zwei Quartale.<br>
<b>Depression:</b> Schrumpfen der Wirtschaft über mehrere Jahre.</p>
<p class="small">Achtung: Manche Quellen (auch das „Master-Briefing“) setzen Abschwung und Rezession gleich. In der Klausur gilt die Definition deiner Lehrkraft.</p></div>
<h3>Das BIP: der wichtigste Maßstab</h3>
<p>Das Bruttoinlandsprodukt ist der Wert aller in einem Jahr im Inland hergestellten Waren und Dienstleistungen (Endprodukte).</p>
<p class="formula">BIP = C + I + G + (X − M)</p>
<div class="tw"><table class="t"><tr><th>Buchstabe</th><th>Bedeutung</th></tr>
<tr><td><b>C</b></td><td>privater Konsum der Haushalte</td></tr>
<tr><td><b>I</b></td><td>Investitionen der Unternehmen und des Staates</td></tr>
<tr><td><b>G</b></td><td>Staatsausgaben für Güter und Dienstleistungen</td></tr>
<tr><td><b>X − M</b></td><td>Exporte minus Importe (Außenbeitrag)</td></tr></table></div>
<p>Die Formel zeigt dir, <b>wo eine Maßnahme ansetzt</b>: Ein Konjunkturprogramm erhöht G, eine Steuersenkung für Haushalte C, eine Investitionsförderung I.</p>
<div class="tw"><table class="t"><tr><th>Kennzahl</th><th>misst</th><th>nützlich für</th></tr>
<tr><td><b>Nominales BIP</b></td><td>Produktionswert zu laufenden Preisen</td><td>Größenvergleiche, internationale Ranglisten</td></tr>
<tr><td><b>Reales BIP</b></td><td>Produktion ohne Preiseffekt</td><td>Wachstum, Rezession, Konjunktur</td></tr>
<tr><td><b>BIP pro Kopf</b></td><td>BIP geteilt durch Einwohnerzahl</td><td>Vergleich des durchschnittlichen Wohlstands</td></tr></table></div>
<h3>Konjunkturindikatoren</h3>
<p>Indikatoren sind Messgrößen, an denen man die Phase ablesen kann. Entscheidend ist, <i>wann</i> sie reagieren. Diese Einteilung stammt aus deinem Unterricht:</p>
<div class="tw"><table class="t"><tr><th>Frühindikatoren</th><th>Präsenzindikatoren</th><th>Spätindikatoren</th></tr>
<tr><td>erlauben Prognosen, sind aber spekulativ</td><td>zeigen den Ist-Zustand</td><td>folgen der Entwicklung verzögert</td></tr>
<tr><td>Gewinnerwartung<br>Auftragslage<br>Geschäftsklimaindex (ifo)<br>ZEW-Index<br>Aktienindex</td><td>BIP<br>Wirtschaftswachstum<br>Sparquote<br>Preisniveau<br>offene Stellen</td><td>Arbeitslosenquote<br>Inflation<br>Insolvenzen<br>Steuereinnahmen<br>Zinsniveau</td></tr></table></div>
<p><b>Warum ist die Arbeitslosenquote ein Spätindikator?</b> Unternehmen entlassen erst, wenn sie sicher sind, dass die Krise anhält, und stellen erst ein, wenn der Aufschwung sicher ist.</p>
<p><b>Konjunktur vs. Wachstum:</b> Konjunktur = kurzfristige Schwankungen. Wirtschaftswachstum = langfristige Entwicklung (der Trend).</p>
<div class="tip"><b>Klausur-Tipp:</b> Ordne eine Phase nie aus dem Bauch heraus ein. Belege sie mit 2–3 Indikatoren aus dem Material: „Das reale BIP ist zwei Quartale geschrumpft, die Auftragslage verschlechtert sich und die Arbeitslosenquote steigt. Das spricht für eine Rezession.“</div>`;

const L2 = `
<p class="lead">Der Staat kann in der Wirtschaft zwei Dinge tun: die <b>Spielregeln</b> festlegen oder selbst <b>ins Spiel eingreifen</b>.</p>
<div class="duo">
<div class="dcol"><h4>Ordnungspolitik</h4><p class="kicker">Die Spielregeln</p><ul>
<li>legt die Grundsätze und <b>Regeln für alles wirtschaftliche Handeln</b> fest (Rahmenbedingungen)</li>
<li><b>langfristig</b> angelegt, ändert sich selten</li>
<li>gibt <b>keine einzelnen Spielzüge</b> vor. Die „Spieler“ (Unternehmer und Verbraucher) entscheiden selbst</li>
<li>Ziele: fairen Wettbewerb sichern, Marktmissbrauch verhindern</li></ul>
<p class="ex">Beispiele: Kartellgesetze gegen Preisabsprachen, Eigentums- und Vertragsrecht, Tarifautonomie, Mindestlohngesetz, Schuldenbremse, unabhängige Zentralbank, Verbraucher- und Umweltschutzgesetze</p></div>
<div class="dcol"><h4>Prozesspolitik</h4><p class="kicker">Das Eingreifen ins Spiel</p><ul>

 sol: `<h4>Musterlösung in Kurzform</h4>
<p><b>Diagnose:</b> Das reale BIP ist zwei Quartale in Folge geschrumpft (−0,3 % und −0,5 %). Nach unserer Definition liegt eine Rezession vor. Das bestätigen der Spätindikator Arbeitslosenquote (5,9 % → 6,7 %), steigende Insolvenzen und die fallenden Frühindikatoren.</p>
<p><b>Bedrohte Ziele:</b> stetiges Wachstum und hoher Beschäftigungsstand. Die Preisniveaustabilität ist nicht gefährdet (1,6 %).</p>
<p><b>Strategie und Maßnahme:</b> Die Ursache ist eine zu schwache Nachfrage. Deshalb empfiehlt sich eine nachfrageorientierte, prozesspolitische Maßnahme: ein befristetes, kreditfinanziertes Investitionsprogramm (Sanierung von Schulen, Ausbau der Schiene).</p>
<p><b>Wirkungskette:</b> Staatsausgaben (G) ↑ → Aufträge für Bauunternehmen → Produktion und Beschäftigung ↑ → Einkommen ↑ → Konsum ↑ (Multiplikator) → BIP ↑, Arbeitslosigkeit ↓.</p>
<p><b>Beurteilung:</b> Dafür spricht, dass die Maßnahme direkt an der Ursache ansetzt und kaum Inflationsgefahr besteht. Zusätzlich verbessern die Investitionen langfristig die Infrastruktur. Dagegen sprechen die steigende Staatsverschuldung (Grenzen der Schuldenbremse) und Time Lags: Planung und Bau dauern, die Wirkung kommt evtl. erst im Aufschwung. <b>Fazit:</b> Wenn die Projekte schnell umsetzbar sind, halte ich die Maßnahme für geeignet.</p>`};

 sol: `<h4>Musterlösung in Kurzform</h4>
<p><b>Diagnose:</b> Das BIP stagniert seit drei Jahren. Die Arbeitslosigkeit steigt langsam, Inflation (2,1 %) und Konsum sind stabil. Es handelt sich nicht um einen kurzen Konjunktureinbruch, sondern um eine anhaltende Wachstumsschwäche.</p>
<p><b>Bedrohte Ziele:</b> Wachstum, mittelfristig auch Beschäftigung.</p>
<p><b>Ursache und Strategie:</b> Die Unternehmensumfrage zeigt ein Angebotsproblem (Energiekosten, Bürokratie, Fachkräfte). Deshalb empfiehlt sich eine angebotsorientierte Politik, vor allem ordnungspolitisch: schnellere Genehmigungsverfahren, Bürokratieabbau, ein Gesetz zur Erleichterung der Fachkräftezuwanderung, dazu niedrigere Unternehmenssteuern.</p>
<p><b>Wirkungskette:</b> niedrigere Kosten und weniger Bürokratie → höhere erwartete Gewinne → Unternehmen investieren wieder im Inland → Produktion und Arbeitsplätze ↑ → Wachstum ↑.</p>
<p><b>Beurteilung:</b> Dafür spricht, dass die Maßnahmen an der Ursache ansetzen und marktkonform sind. Dagegen spricht, dass sie erst nach Jahren wirken, Steuerausfälle gegenfinanziert werden müssen, Gewinne nicht automatisch investiert werden und die Ungleichheit steigen kann. <b>Fazit:</b> Langfristig sinnvoll, am besten ergänzt durch eine soziale Absicherung.</p>`};

 sol: `<h4>Musterlösung in Kurzform</h4>
<p><b>Diagnose:</b> Das BIP ist zwei Quartale geschrumpft: Rezession. Gleichzeitig liegt die Inflation bei 6,9 %. Diese Kombination heißt <b>Stagflation</b>. Ursache ist ein Kostenschock auf der Angebotsseite (Energiepreise).</p>

/* Karteikarten */
function runCards(el, cards) {
  R = { deck: shuffle(cards.map((_, i) => i)), flipped: false, total: cards.length, again: 0 };
  const draw = () => {
    if (!R.deck.length) {
      el.innerHTML = '<div class="result"><p class="big">✓</p><h3 style="margin-top:0">Alle ' + R.total + ' Karten gewusst</h3><p>' + (R.again ? R.again + '× hast du „Nochmal“ gewählt. Die Begriffe kommen im Quiz wieder.' : 'Ohne einen einzigen Fehler!') + '</p></div><button class="btn wide" id="nx">' + nextLabel() + '</button><button class="btn ghost wide" id="rp">Karten nochmal durchgehen</button>';
      $('#nx').onclick = nextStep; $('#rp').onclick = () => runCards(el, cards); return;
    }
    const c = cards[R.deck[0]];
    el.innerHTML = '<div class="counter"><span>' + (R.total - R.deck.length) + ' von ' + R.total + ' gewusst</span><span>' + R.deck.length + ' übrig</span></div>' +
      '<button class="flash' + (R.flipped ? ' back' : '') + '" id="fc">' + (R.flipped ? '<span class="term" style="font-size:1.15rem">' + c[0] + '</span><span class="def">' + c[1] + '</span>' : '<span class="term">' + c[0] + '</span><span class="hint">Erst selbst erklären, dann tippen zum Umdrehen</span>') + '</button>' +
      (R.flipped ? '<div class="row2"><button class="btn ghost" id="ag">Nochmal</button><button class="btn" id="kn">Gewusst</button></div>' : '');
    $('#fc').onclick = () => { R.flipped = !R.flipped; draw(); };
    if (R.flipped) {
      $('#kn').onclick = () => { R.deck.shift(); R.flipped = false; draw(); };
      $('#ag').onclick = () => { R.deck.push(R.deck.shift()); R.again++; R.flipped = false; draw(); };
    }
  };
  draw();
}

/* Zuordnen */
function runSort(el, data) {
  R = { items: shuffle(data.items), i: 0, score: 0, ans: null };
  const draw = () => {
    if (R.i >= R.items.length) {
      el.innerHTML = '<div class="result"><p class="big">' + R.score + '/' + R.items.length + '</p><p>' + (R.score >= R.items.length - 2 ? 'Sehr sicher zugeordnet.' : 'Lies bei den Fehlern die Begründung noch einmal und wiederhole die Übung.') + '</p></div><button class="btn wide" id="nx">' + nextLabel() + '</button><button class="btn ghost wide" id="rp">Übung wiederholen</button>';
      $('#nx').onclick = nextStep; $('#rp').onclick = () => runSort(el, data); return;
    }
    const it = R.items[R.i];
    let h = '<div class="qhead"><span>Maßnahme ' + (R.i + 1) + ' von ' + R.items.length + '</span><span>' + R.score + ' richtig</span></div><div class="bar"><i style="width:' + (R.i / R.items.length * 100) + '%"></i></div>' +
      '<div class="sortcard">' + it[0] + '</div><div class="sortbtns">';
    data.cats.forEach((c, k) => {
      let cls = ''; if (R.ans !== null) { if (k === it[1]) cls = 'right'; else if (k === R.ans) cls = 'wrong'; }
      h += '<button class="' + cls + '" data-c="' + k + '"' + (R.ans !== null ? ' disabled' : '') + '>' + c + '</button>';
    });
    h += '</div>';
    if (R.ans !== null) { const ok = R.ans === it[1]; h += '<div class="expl ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Richtig.' : 'Falsch: ' + data.cats[it[1]] + '.') + '</b> ' + it[2] + '</div><button class="btn wide" id="sn">Nächste Maßnahme</button>'; }
    el.innerHTML = h;
    el.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { R.ans = +b.dataset.c; if (R.ans === it[1]) R.score++; draw(); });
    if (R.ans !== null) $('#sn').onclick = () => { R.i++; R.ans = null; draw(); };
  };
  draw();
}

/* Quiz */
function runQuiz(el, items, opts) {
  R = { items, i: 0, score: 0, ans: null, order: null };
  const draw = () => {
    if (R.i >= R.items.length) {
      const pct = R.score / R.items.length;
      el.innerHTML = '<div class="result"><p class="big">' + R.score + '/' + R.items.length + '</p><p>' +
        (pct >= .8 ? 'Sehr gut, das sitzt.' : pct >= .6 ? 'Solide. Schau dir die falschen Antworten im Block 6 nochmal an.' : 'Lies den Lerntext noch einmal kurz und wiederhole das Quiz.') + '</p></div>' +
        (opts.sol ? '<div class="sol">' + opts.sol + '</div>' : '') +
        '<button class="btn wide" id="nx">' + nextLabel() + '</button><button class="btn ghost wide" id="rp">' + (opts.sol ? 'Fall wiederholen' : 'Quiz wiederholen') + '</button>';
      $('#nx').onclick = opts.done; $('#rp').onclick = () => runQuiz(el, opts.sol ? items : shuffle(items), opts); return;
    }
    const it = R.items[R.i];
    if (!R.order) R.order = shuffle(it.o.map((t, k) => ({ t, k })));
    let h = (opts.title && R.i === 0 ? '<p class="small">' + opts.title + '</p>' : '') +
      '<div class="qhead"><span>Frage ' + (R.i + 1) + ' von ' + R.items.length + '</span><span>' + R.score + ' richtig</span></div><div class="bar"><i style="width:' + (R.i / R.items.length * 100) + '%"></i></div>';
    const ctx = opts.intro || it.ctx;
    if (ctx) h += '<details class="ctx" open><summary>Fall-Material</summary>' + ctx + '</details>';
    h += '<h3 class="q">' + it.q + '</h3><div class="opts">';
    R.order.forEach((o, n) => {
      let c = 'opt'; if (R.ans !== null) { if (o.k === 0) c += ' right'; else if (n === R.ans) c += ' wrong'; else c += ' dim'; }
      h += '<button class="' + c + '" data-n="' + n + '"' + (R.ans !== null ? ' disabled' : '') + '>' + o.t + '</button>';
    });
    h += '</div>';
    if (R.ans !== null) {
      const ok = R.order[R.ans].k === 0;
      h += '<div class="expl ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Richtig.' : 'Nicht ganz.') + '</b> ' + it.e + '</div><button class="btn wide" id="qn">' + (R.i < R.items.length - 1 ? 'Nächste Frage' : 'Auswertung') + '</button>';
    }
    el.innerHTML = h;
    el.querySelectorAll('.tw table, details table').forEach(() => {});
    el.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      R.ans = +b.dataset.n;
      if (R.order[R.ans].k === 0) { R.score++; delete P.wrong[it.id]; } else P.wrong[it.id] = 1;
      save(); draw();
      const ex = el.querySelector('.expl'); if (ex) ex.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    if (R.ans !== null) $('#qn').onclick = () => { R.i++; R.ans = null; R.order = null; draw(); window.scrollTo(0, 0); };
  };
  draw();
}

/* Probeaufgabe */
function runWrite(el, c) {
  el.innerHTML = '<details class="ctx" open><summary>Fall-Material</summary>' + c.ctx + '</details>' + c.task +
    '<label for="note-u6" class="small">Deine Stichpunkte (werden nur auf diesem Gerät gespeichert)</label>' +
    '<textarea id="note-u6" placeholder="1. Lage: …&#10;2. Maßnahme: …&#10;   Wirkungskette: … → … → …&#10;3. Pro: …  Contra: …  Fazit: …"></textarea>' +
    '<button class="btn wide" id="show">Musterlösung anzeigen</button><div id="solbox"></div>';
  const ta = $('#note-u6'); ta.value = P.notes.u6 || '';
  ta.oninput = () => { P.notes.u6 = ta.value; save(); };
  $('#show').onclick = () => {
    $('#solbox').innerHTML = '<div class="sol">' + c.sol + '</div><div class="tip"><b>Selbstcheck:</b> Hast du (1) die Phase mit Daten belegt, (2) die bedrohten Ziele genannt, (3) Angebot/Nachfrage und Ordnung/Prozess zugeordnet, (4) eine Wirkungskette, (5) Pro, Contra und ein Fazit? Jeder Haken bringt Punkte.</div><button class="btn wide" id="nx">Generalprobe abschließen</button>';
    $('#show').remove(); $('#nx').onclick = nextStep;
  };
}

render();
</script>
